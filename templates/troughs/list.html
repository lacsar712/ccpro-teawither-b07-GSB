{% extends "base.html" %}
{% block title %}萎凋槽{% endblock %}
{% block content %}
<div class="page-header">
  <h1>萎凋槽</h1>
  <div class="actions">
    <button class="btn btn-secondary btn-sm"
            hx-get="{{ request.get_full_path }}"
            hx-target="#trough-table"
            hx-swap="innerHTML">刷新列表</button>
    <a class="btn" href="{% url 'trough_create' %}">新建槽位</a>
  </div>
</div>
<div class="filter-bar">
  <a class="btn btn-sm {% if not status_filter %}btn-filter-active{% else %}btn-secondary{% endif %}"
     href="{% url 'trough_list' %}">全部</a>
  {% for code, label in status_choices %}
  <a class="btn btn-sm {% if status_filter == code %}btn-filter-active{% else %}btn-secondary{% endif %}"
     href="{% url 'trough_list' %}?status={{ code }}">{{ label }}</a>
  {% endfor %}
</div>
<div class="card" id="trough-table">
  {% include "troughs/_table.html" %}
</div>
{% endblock %}
